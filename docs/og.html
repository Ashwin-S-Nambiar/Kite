<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex">
  <title>Kite · Share image</title>
  <style>
@font-face{font-family:"Familjen Grotesk";src:url("../public/fonts/familjen-latin.woff2") format("woff2");font-weight:400 700;font-display:block}
@font-face{font-family:"Bespoke Stencil";src:url("../public/fonts/stencil/bespoke-stencil-800.woff2") format("woff2");font-weight:800;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fcfcf8;color:#161616;font-family:"Familjen Grotesk",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
main{position:relative;width:1200px;height:630px}
.contours{position:absolute;inset:0}
.copy{position:absolute;left:72px;top:50%;transform:translateY(-50%);width:610px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:40px;height:40px;flex:none}
.brand span{font-family:"Bespoke Stencil",sans-serif;font-weight:800;font-size:40px;line-height:1}
h1{font-weight:600;font-size:52px;line-height:1.06;letter-spacing:-.015em;margin:40px 0 26px}
h1 em{font-style:normal;color:#c04a0e}
p{margin:0;color:#4a4742;font-size:22px;line-height:1.45}
.visual{position:absolute;left:700px;top:0;width:500px;height:630px;overflow:hidden;border-left:3px solid #161616}
.visual img{position:absolute;width:754px;left:-6px;top:-4px}
  </style>
</head>
<body>
  <main>
    <svg class="contours" viewBox="0 0 1200 630" aria-hidden="true">
      <path d="M-40 640 C 60 520 230 540 300 640 Z" fill="#c8e6b8" opacity=".55"/>
      <g fill="none" stroke="#c06a2b" stroke-width="1.3" opacity=".22">
        <path d="M380 80 C 470 20 640 40 660 140 S 600 300 480 300 S 330 240 340 170 S 350 110 380 80 Z"/>
        <path d="M420 110 C 490 66 610 82 624 150 S 580 266 488 266 S 380 220 386 170 S 396 128 420 110 Z"/>
      </g>
    </svg>
    <div class="copy">
      <div class="brand"><svg viewBox="0 0 70 70" aria-hidden="true"><path d="M2 2h66v66H2z" fill="#fff"/><path d="M68 2v66H2z" fill="#ef6420"/><path d="M2 2h66v66H2z" fill="none" stroke="#161616" stroke-width="4"/></svg><span>KITE</span></div>
      <h1>Race through Wikipedia,<br><em>checkpoint to checkpoint.</em></h1>
      <p>Get from the start to the finish using only<br>the links inside each article. Fewest clicks wins.</p>
    </div>
    <div class="visual"><img src="screenshots/og-map-crop.webp" alt="Today's course on an orienteering map, with the checkpoint list and a punched card"></div>
  </main>
</body>
</html>
